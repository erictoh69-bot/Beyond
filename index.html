<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BEYOND – Learn. Think. Grow.</title>
<meta name="description" content="A free learning space for Class 9 and Class 10 students: Bangla, English, Math, Science, Biology, Chemistry and other subject resources, practice questions and more.">
<meta name="theme-color" content="#0B1F3A">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 48 48'%3E%3Crect width='48' height='48' rx='10' fill='%230B1F3A'/%3E%3Ccircle cx='22' cy='27' r='11' fill='none' stroke='white' stroke-width='4'/%3E%3Ccircle cx='35' cy='13' r='5' fill='%2322B8E6'/%3E%3C/svg%3E">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="top">
  <div class="bar">
    <a class="logo" href="#home" aria-label="BEYOND home">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 48" role="img" aria-label="BEYOND">
        <circle cx="22" cy="26" r="13" fill="none" stroke="currentColor" stroke-width="4"/>
        <circle cx="36" cy="11" r="5" fill="#22B8E6"/>
        <text x="50" y="35" font-family="system-ui,-apple-system,'Segoe UI',Roboto,sans-serif" font-size="28" font-weight="800" letter-spacing="3" fill="currentColor">BEYOND</text>
      </svg>
    </a>
    <button class="langbtn" id="langbtn" type="button">বাংলা</button>
    <button class="burger" id="burger" aria-label="Open menu" aria-expanded="false" aria-controls="menu"><span></span><span></span><span></span></button>
    <nav id="menu" aria-label="Main"></nav>
  </div>
</header>
<div class="scrim" id="scrim"></div>
<main id="app" tabindex="-1"></main>
<!-- Hidden copy of the Ask Your Teacher form, so Netlify detects it at deploy time.
     The visible form is rendered by script.js; both share the name "ask-teacher". -->
<form name="ask-teacher" method="POST" data-netlify="true" netlify-honeypot="bot-field" style="display:none">
  <input type="text" name="name">
  <select name="class"><option value="9">9</option><option value="10">10</option></select>
  <select name="subject"><option value="Bangla">Bangla</option><option value="English">English</option><option value="Math">Math</option><option value="Science">Science</option><option value="Biology">Biology</option><option value="Chemistry">Chemistry</option><option value="Others">Others</option></select>
  <textarea name="question"></textarea>
  <input type="text" name="bot-field">
</form>
<footer class="foot"><p id="foot">An independent learning space, built around the belief that knowledge should be accessible to everyone.</p></footer>
<nav class="bnav" id="bnav" aria-label="Quick"></nav>
<script src="script.js"></script>
</body>
</html>
